<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CampusGo 離線</title>

    <link
        rel="manifest"
        href="/campusgo/manifest.json"
    >

    <meta
        name="theme-color"
        content="#2563eb"
    >

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #f3f6fb;
            color: #1f2937;
        }

        .offline-card {
            width: min(90%, 360px);
            padding: 32px 24px;
            text-align: center;
            background: white;
            border-radius: 20px;
            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.08);
        }

        .offline-card img {
            width: 96px;
            height: 96px;
            border-radius: 22px;
            margin-bottom: 16px;
        }

        h1 {
            margin: 0 0 12px;
            color: #2563eb;
        }

        p {
            line-height: 1.7;
            margin: 8px 0;
        }

        button {
            margin-top: 20px;
            padding: 12px 20px;
            border: 0;
            border-radius: 12px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <main class="offline-card">

        <img
            src="img/icon-192.png"
            alt="CampusGo 圖示"
        >

        <h1>你目前離線</h1>

        <p>
            CampusGo 暫時無法連上網路。
        </p>

        <p>
            請確認 Wi-Fi 或行動網路，
            恢復連線後再重新整理。
        </p>

        <button
            type="button"
            onclick="location.reload()"
        >
            重新整理
        </button>

    </main>

</body>

</html>
